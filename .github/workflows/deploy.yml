name: Build and deploy to GitHub Pages

on:
  push:
    branches: [ master, dev ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build JS dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y npm
          ./dependencies/make.sh

      - name: Create output dir
        run: |
          rm -fr output
          mv ./dependencies/dist output
          cp ./src/* ./tools/* output
          (cd output; tar -czf ../JSWebGit.tgz *)

      - name: Create demo
        run: |
          mv JSWebGit.tgz output
          sed -e 's#const rootURL = "/";#const rootURL = "/JSWebGit/";#' -i output/git.html
          echo '<html lang="en"> <head> <meta charset="utf-8"> <title>JSWebGit Demo</title> </head> <body>' > output/index.html
          cat README.md >> output/index.html
          echo '</body> </html>' >> output/index.html
          (cd output; echo "JSWebGit https://github.com/opcode-eu-org-libs/JSWebGit.git" | ./make-repos.sh useCurrent)

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './output'

  deploy-github:
    # https://opcode-eu-org-libs.github.io/JSWebGit
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
